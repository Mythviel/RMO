const levelClass = { Core:'badge-core', Advanced:'badge-adv', Extended:'badge-ext' };
let rows = [];


data.forEach((row, i) => {
  const [main, sub, subsub, deep, level] = row;
  const shade = ['Core','Advanced','Extended'].indexOf(level);
  const tr = document.createElement('tr');
  tr.className = i % 2 === 0 ? 'topic-row-a' : 'topic-row-b';
  tr.innerHTML = `
    <td class="num-col">${i+1}</td>
    <td><span class="main-topic">${main}</span></td>
    <td><span class="subtopic">${sub}</span></td>
    <td><span class="sub-sub">${subsub}</span></td>
    <td><span class="deep">${deep}</span></td>
    <td class="tag-col"><span class="badge ${levelClass[level]}">${level}</span></td>

  rows.push(tr);

function filterTable(q) {
  const s = q.toLowerCase().trim();
  rows.forEach(r => {
    r.classList.toggle('hidden', s !== '' && !r.dataset.text.includes(s));
  });
}
